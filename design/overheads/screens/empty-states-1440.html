<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overhead Shots — Empty states (1440px)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}button{font-family:inherit}</style>
</head>
<body>
<div style="width:1440px;height:700px;box-sizing:border-box;background:#FAFAFA;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;color:#19191C;display:flex;flex-direction:column;overflow:hidden">

  <div style="height:56px;flex-shrink:0;display:flex;align-items:center;padding:0 20px;background:#FFFFFF;border-bottom:1px solid #E4E4E7;box-sizing:border-box">
    <span style="font-size:13px;color:#52525B">Reel / Streetside Diner / Scene 12</span>
    <span style="color:#D4D4D8;margin:0 8px">/</span>
    <span style="font-size:13px;font-weight:500">Overhead Shots</span>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:28px;padding:40px;box-sizing:border-box">

    <div style="width:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:1px dashed #E4E4E7;border-radius:10px;padding:64px 40px;box-sizing:border-box;background:#FFFFFF">
      <svg width="40" height="40" viewBox="0 0 40 40" style="color:#A1A1AA">
        <rect x="6" y="8" width="28" height="24" rx="2" style="fill:none;stroke:#A1A1AA;stroke-width:1.5"></rect>
        <line x1="6" y1="16" x2="34" y2="16" style="stroke:#A1A1AA;stroke-width:1.5"></line>
        <line x1="12" y1="23" x2="22" y2="23" style="stroke:#A1A1AA;stroke-width:1.5"></line>
        <line x1="12" y1="27" x2="26" y2="27" style="stroke:#A1A1AA;stroke-width:1.5"></line>
      </svg>
      <p style="font-size:14px;font-weight:500;color:#27272A;text-align:center;margin:0;max-width:360px">This scene has no set yet — add one before the agent can block shots.</p>
      <button type="button" style="height:36px;padding:0 16px;border:none;border-radius:6px;background:#3C49D6;color:#FFFFFF;font-size:13px;font-weight:500">Add a set</button>
    </div>

    <div style="width:600px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:1px dashed #E4E4E7;border-radius:10px;padding:64px 40px;box-sizing:border-box;background:#FFFFFF">
      <svg width="40" height="40" viewBox="0 0 40 40" style="color:#A1A1AA">
        <circle cx="20" cy="20" r="14" style="fill:none;stroke:#A1A1AA;stroke-width:1.5"></circle>
        <circle cx="20" cy="20" r="5" style="fill:none;stroke:#A1A1AA;stroke-width:1.5"></circle>
        <line x1="20" y1="20" x2="20" y2="10" style="stroke:#A1A1AA;stroke-width:1.5"></line>
      </svg>
      <p style="font-size:14px;font-weight:500;color:#27272A;text-align:center;margin:0;max-width:360px">The set is ready, but no shots have been drafted for this scene yet.</p>
      <button type="button" style="height:36px;padding:0 16px;border:none;border-radius:6px;background:#3C49D6;color:#FFFFFF;font-size:13px;font-weight:500">Draft overheads</button>
    </div>
  </div>
</div>
</body>
</html>
